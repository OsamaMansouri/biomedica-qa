name: Playwright Chromium
description: npm ci in playwright/ with cached Chromium (skips browser download on cache hit).
runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        # Include OS version so ubuntu-latest→26.04 cache misses don't poison 24.04 jobs.
        key: playwright-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('playwright/package-lock.json') }}

    - name: Install npm dependencies
      shell: bash
      working-directory: playwright
      run: npm ci

    - name: Install Chromium
      shell: bash
      working-directory: playwright
      run: npx playwright install chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
